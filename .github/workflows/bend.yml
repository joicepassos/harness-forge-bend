name: Bend core
on:
  push:
    branches: [main, 'bend/**']
    paths: ['bend/**', '.github/workflows/bend.yml']
  pull_request:
    paths: ['bend/**', '.github/workflows/bend.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  analyze:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.14'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check laws, test and build native Bend
        run: sh bend/build.sh
      - name: Analyze this repository
        run: python3 bend/scan.py . > "$RUNNER_TEMP/report.md"
      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}
          path: ${{ runner.temp }}/report.md
